pipeline:
  name: iacm-showcase-destroy
  identifier: iacm_showcase_destroy
  orgIdentifier: testprameet
  projectIdentifier: testproj
  tags:
    showcase: iacm
  stages:
    - stage:
        name: destroy
        identifier: destroy
        description: Removes everything the selected workspace manages, after a reviewed destroy plan.
        type: IACM
        spec:
          workspace: <+input>
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: IACMTerraformPlugin
                  name: init
                  identifier: init
                  timeout: 10m
                  spec:
                    command: init
              - step:
                  type: IACMTerraformPlugin
                  name: plan-destroy
                  identifier: plan_destroy
                  timeout: 10m
                  spec:
                    command: plan-destroy
              - step:
                  type: IACMApproval
                  name: approve-destroy
                  identifier: approve_destroy
                  timeout: 1h
                  spec:
                    autoApprove: false
              - step:
                  type: IACMTerraformPlugin
                  name: destroy
                  identifier: destroy
                  timeout: 20m
                  spec:
                    command: destroy
