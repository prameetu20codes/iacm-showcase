pipeline:
  name: iacm-showcase-drift
  identifier: iacm_showcase_drift
  orgIdentifier: testprameet
  projectIdentifier: testproj
  tags:
    showcase: iacm
  stages:
    - stage:
        name: drift
        identifier: drift
        description: Fails and flags resources in the workspace Resources tab when live infrastructure differs from state.
        type: IACM
        spec:
          workspace: <+input>
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: IACMTerraformPlugin
                  name: init
                  identifier: init
                  timeout: 10m
                  spec:
                    command: init
              - step:
                  type: IACMTerraformPlugin
                  name: plan
                  identifier: plan
                  timeout: 10m
                  spec:
                    command: plan
              - step:
                  type: IACMTerraformPlugin
                  name: detect-drift
                  identifier: detect_drift
                  timeout: 10m
                  spec:
                    command: detect-drift
